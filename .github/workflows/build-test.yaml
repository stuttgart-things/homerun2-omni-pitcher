name: CI - Dagger Build & Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dagger lint
        uses: dagger/dagger-for-github@v8.4.1
        with:
          module: ./dagger
          call: lint --src . --progress plain
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      # Report-only for now: 13 reachable findings today, all from transitive
      # deps pulled in by homerun-library. Flip to --fail-on-vuln once that
      # list is clear (#158).
      - name: Dagger govulncheck
        uses: dagger/dagger-for-github@v8.4.1
        with:
          module: ./dagger
          call: govulncheck --src . --progress plain export --path ./govulncheck-report.txt
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Upload govulncheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: govulncheck-report
          path: govulncheck-report.txt

      - name: Dagger build-and-test
        uses: dagger/dagger-for-github@v8.4.1
        with:
          module: ./dagger
          call: build-and-test-binary --source . --progress plain
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dagger-logs
          path: |
            ~/.cache/dagger
            /tmp/dagger-*.log
